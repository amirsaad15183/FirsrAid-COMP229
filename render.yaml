services:
  - type: web
    name: lifeready-training-comp229
    runtime: node
    buildCommand: npm ci && npm --prefix client ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
